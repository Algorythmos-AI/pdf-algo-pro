# PDF Algo Pro Xcode project, generated by XcodeGen (ADR-0002). Never commit the .xcodeproj:
#   xcodegen generate && python3 scripts/ci/write_testplan.py
# The Team ID is injected at build time and never committed (ADR-0015): pass DEVELOPMENT_TEAM on
# the command line or in a git-ignored xcconfig.
name: PDFAlgoPro
options:
  bundleIdPrefix: com.algorythmos
  deploymentTarget:
    # Temporary floor while Xcode 27 is unavailable (readiness blocker C2, decision PAP-029).
    # Raise to 27.0 with ADR-0001 once Xcode 27 builds locally and in CI.
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
  developmentLanguage: en
configs:
  Debug: debug
  Staging: release
  Release: release
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    CODE_SIGN_STYLE: Automatic
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
packages:
  Core:
    path: Packages/Core
  DesignSystem:
    path: Packages/DesignSystem
  PDFEngine:
    path: Packages/PDFEngine
  DocumentStore:
    path: Packages/DocumentStore
  OCR:
    path: Packages/OCR
  Scanning:
    path: Packages/Scanning
  Search:
    path: Packages/Search
  Intelligence:
    path: Packages/Intelligence
  Telemetry:
    path: Packages/Telemetry
  Onboarding:
    path: Packages/Features/Onboarding
  Library:
    path: Packages/Features/Library
  Reader:
    path: Packages/Features/Reader
  Assistant:
    path: Packages/Features/Assistant
  Scan:
    path: Packages/Features/Scan
  Settings:
    path: Packages/Features/Settings
targets:
  PDFAlgoPro:
    type: application
    platform: iOS
    sources:
      - path: App/PDFAlgoPro
    dependencies:
      - package: Core
      - package: DocumentStore
      - package: PDFEngine
      - package: OCR
      - package: Search
      - package: Intelligence
      - package: Telemetry
      - package: Onboarding
        product: OnboardingFeature
      - package: Library
        product: LibraryFeature
      - package: Reader
        product: ReaderFeature
      - package: Assistant
        product: AssistantFeature
      - package: Scan
        product: ScanFeature
      - package: Settings
        product: SettingsFeature
    info:
      path: App/PDFAlgoPro/Info.plist
      properties:
        CFBundleDisplayName: PDF Algo Pro
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        LSSupportsOpeningDocumentsInPlace: true
        UIFileSharingEnabled: true
        UISupportsDocumentBrowser: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: PDF Algo Pro uses the camera only when you scan a document. Scans stay on this device.
        CFBundleURLTypes:
          - CFBundleURLName: com.algorythmos.pdfalgopro
            CFBundleURLSchemes: [pdfalgopro]
        CFBundleDocumentTypes:
          - CFBundleTypeName: PDF document
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.adobe.pdf]
        NSUserActivityTypes:
          - com.apple.corespotlightitem
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.algorythmos.pdfalgopro
        PRODUCT_NAME: PDFAlgoPro
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_UPCOMING_FEATURE_NONISOLATED_NONSENDING_BY_DEFAULT: YES
        GENERATE_INFOPLIST_FILE: NO
      configs:
        Staging:
          PRODUCT_BUNDLE_IDENTIFIER: com.algorythmos.pdfalgopro.staging
  PDFAlgoProUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: App/UITests
    dependencies:
      - target: PDFAlgoPro
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.algorythmos.pdfalgopro.uitests
        TEST_TARGET_NAME: PDFAlgoPro
        TARGETED_DEVICE_FAMILY: "1,2"
schemes:
  PDFAlgoPro:
    build:
      targets:
        PDFAlgoPro: all
        PDFAlgoProUITests: [test]
    test:
      config: Debug
      gatherCoverageData: true
      testPlans:
        - path: PDFAlgoPro.xctestplan
          defaultPlan: true
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
