# PDF Algo Pro planned backlog (backlog as code). See docs/project-management.md#backlog-as-code.
#
# Sync to GitHub issues (keyed by `id`; re-running never duplicates):
#   uv run --with pyyaml==6.0.2 python scripts/gh/sync_github.py backlog            # dry run
#   uv run --with pyyaml==6.0.2 python scripts/gh/sync_github.py backlog --apply
#
# Fields
#   id           stable identifier, never reused (F- foundation, M- MVP, V- V1, P- V1.1, W- V2)
#   title        issue title (sentence case, no trailing full stop)
#   type         epic | spike | task
#   milestone    Foundation | MVP | V1 | V1.1 | V2 (must exist in .github/milestones.yml)
#   priority     p0 | p1 | p2 | p3            -> label priority:<value>
#   size         s | m | l | xl               -> label size:<value>
#   pillars      PIL-1 … PIL-7 (at least one)
#   labels       extra labels (must exist in .github/labels.yml or the org label set)
#   refs         PRD requirement IDs, ADRs, readiness blockers
#   acceptance   what must be true to close the issue
#
# PUBLIC REPOSITORY: only engineering and product work belongs here. Account, agreement, vendor-
# commercial, billing and business items are tracked privately and never appear in this file.

items:
