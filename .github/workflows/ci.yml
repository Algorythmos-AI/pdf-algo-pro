name: ci

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [integration, main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pr-title:
    name: pr-title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Conventional-commit pull request title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|chore|ci|refactor|perf|test|build|revert|release)(\([a-z0-9/-]+\))?!?: .+'
          if ! printf '%s' "$TITLE" | grep -Eq "$pattern"; then
            echo "::error::PR title must be a Conventional Commit, e.g. \"feat(ocr): add French recognition\". Got: \"$TITLE\""
            exit 1
          fi

  promotion-guard:
    name: promotion-guard
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Only integration or hotfix/* may merge into main
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          if [ "$BASE" = "main" ] && [ "$HEAD" != "integration" ] && [[ "$HEAD" != hotfix/* ]]; then
            echo "::error::Pull requests into main must come from integration (release) or hotfix/* (hotfix). Got: $HEAD"
            exit 1
          fi
          echo "ok: $HEAD -> $BASE"

  secrets:
    uses: Algorythmos-AI/.github/.github/workflows/security.yml@1078ed679bed88c7a41744cda79aa505eb4ff277
    with:
      semgrep: false

  docs:
    name: docs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Links, headings, indexes (blocking); evidence and freshness (warnings)
        run: python3 scripts/ci/check_docs.py

  invariants:
    name: invariants
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Source and privacy-manifest invariants
        run: python3 scripts/ci/invariants.py
      - name: Design tokens match the generated Swift (drift and contrast)
        run: python3 scripts/design/generate_tokens.py --check
      - name: Script unit tests (sync, docs gate, coverage gate)
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet pytest==8.4.2 pyyaml==6.0.2
          "$RUNNER_TEMP/venv/bin/python" -m pytest -q -p no:cacheprovider scripts

  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      ios: ${{ steps.detect.outputs.ios }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: detect
        name: Did Swift or project inputs change?
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          pattern='(\.swift$|^project\.yml$|^Packages/|^App/|\.xctestplan$|\.xcprivacy$|Package\.resolved$|^\.github/workflows/ci\.yml$)'
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BASE_SHA" 2>/dev/null; then
            changed="$(git ls-files)"
          else
            changed="$(git diff --name-only "$BASE_SHA" HEAD)"
          fi
          if printf '%s\n' "$changed" | grep -Eq "$pattern" && [ -f project.yml ]; then
            echo "ios=true" >> "$GITHUB_OUTPUT"
          else
            echo "ios=false" >> "$GITHUB_OUTPUT"
          fi

  ios:
    name: ios
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-26
    timeout-minutes: 60
    env:
      XCODEGEN_VERSION: "2.46.0"
      XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
      # Interim toolchain until Xcode 27 is available (readiness blocker C2, decision PAP-029): the
      # newest Xcode 26 and the iOS 26 simulator. Raise both to 27 together with ADR-0001's floor.
      XCODE_MAJOR: "26"
      SIMULATOR_NAME: iPhone 17
      SIMULATOR_RUNTIME: com.apple.CoreSimulator.SimRuntime.iOS-26
      SCHEME: PDFAlgoPro
      TEST_PLAN: PDFAlgoPro
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select the pinned Xcode major version (fail if missing)
        run: |
          xcode="$(find /Applications -maxdepth 1 -name "Xcode_${XCODE_MAJOR}*.app" 2>/dev/null | sort -V | tail -1)"
          if [ -z "$xcode" ]; then
            echo "::error::Xcode ${XCODE_MAJOR} is not installed on this runner image"
            exit 1
          fi
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version
      - name: Install pinned XcodeGen (checksum verified)
        run: |
          curl -sSL -o xcodegen.zip "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          echo "${XCODEGEN_SHA256}  xcodegen.zip" | shasum -a 256 -c -
          unzip -q xcodegen.zip -d "$RUNNER_TEMP/xcodegen"
          echo "$RUNNER_TEMP/xcodegen/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Generate project and test plan, and check the package lockfile
        run: |
          xcodegen generate
          python3 scripts/ci/write_testplan.py
          xcodebuild -resolvePackageDependencies -scheme "$SCHEME"
          git diff --exit-code -- '*Package.resolved'
      - name: Format (swift format, strict)
        run: xcrun swift-format lint --strict --recursive App Packages
      - name: Build for testing (unsigned, warnings as errors)
        run: |
          # Pinned device and runtime: snapshot references are recorded on exactly this simulator.
          device="$(xcrun simctl list devices available -j | SIM_NAME="$SIMULATOR_NAME" SIM_RUNTIME="$SIMULATOR_RUNTIME" python3 -c 'import json,os,sys; d=json.load(sys.stdin)["devices"]; ids=[x["udid"] for k in d if k.startswith(os.environ["SIM_RUNTIME"]) for x in d[k] if x["name"] == os.environ["SIM_NAME"]]; print(ids[0] if ids else "")')"
          if [ -z "$device" ]; then
            runtime="$(xcrun simctl list runtimes available -j | SIM_RUNTIME="$SIMULATOR_RUNTIME" python3 -c 'import json,os,sys; r=[x["identifier"] for x in json.load(sys.stdin)["runtimes"] if x["identifier"].startswith(os.environ["SIM_RUNTIME"])]; print(sorted(r)[-1] if r else "")')"
            if [ -z "$runtime" ]; then echo "::error::no simulator runtime $SIMULATOR_RUNTIME* on this runner"; exit 1; fi
            device="$(xcrun simctl create "$SIMULATOR_NAME" "$SIMULATOR_NAME" "$runtime")"
            echo "created $SIMULATOR_NAME on $runtime"
          fi
          echo "SIM=$device" >> "$GITHUB_ENV"
          xcodebuild build-for-testing -scheme "$SCHEME" -testPlan "$TEST_PLAN" \
            -destination "id=$device" CODE_SIGNING_ALLOWED=NO SWIFT_TREAT_WARNINGS_AS_ERRORS=YES
      - name: Tests (unit, UI, accessibility audit, snapshots)
        id: tests
        run: |
          xcodebuild test-without-building -scheme "$SCHEME" -testPlan "$TEST_PLAN" \
            -destination "id=$SIM" -enableCodeCoverage YES -resultBundlePath Tests.xcresult
      - name: Coverage gate (80% overall and per module)
        # Runs even when a test failed, so one run reports every problem. A test bundle that crashed
        # records no coverage, so its module can look low until the crash is fixed.
        if: ${{ !cancelled() && hashFiles('Tests.xcresult/Info.plist') != '' }}
        env:
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          if [ "$TESTS_OUTCOME" != "success" ]; then
            echo "::warning::Tests did not pass, so the coverage below may be incomplete"
          fi
          xcrun xccov view --report --json Tests.xcresult > coverage.json
          python3 scripts/ci/coverage_gate.py coverage.json --min 80
      - name: Keep the result bundle on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Tests.xcresult
          path: Tests.xcresult
          retention-days: 7
