name: codeql

on:
  pull_request:
  push:
    branches: [integration, main]
  schedule:
    - cron: "0 19 * * *" # nightly, 05:00 Sydney
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer commit supersedes an older analysis of the same kind, except on main, where every release is
  # analysed; the event is part of the key, so the nightly run is never cancelled by a push.
  group: codeql-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  actions:
    name: codeql (actions)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: actions
          queries: security-extended
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2

  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      swift: ${{ steps.detect.outputs.swift }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: detect
        name: Did Swift or project inputs change?
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # The Swift inputs of the ios job in ci.yml, plus this workflow; used for pushes to main. A
          # scheduled or manual run has no base and analyses everything.
          pattern='(\.swift$|^project\.yml$|^Packages/|^App/|Package\.resolved$|^\.github/workflows/codeql\.yml$)'
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BASE_SHA" 2>/dev/null; then
            changed="$(git ls-files)"
          else
            changed="$(git diff --name-only "$BASE_SHA" HEAD)"
          fi
          if printf '%s\n' "$changed" | grep -Eq "$pattern" && [ -f project.yml ]; then
            echo "swift=true" >> "$GITHUB_OUTPUT"
          else
            echo "swift=false" >> "$GITHUB_OUTPUT"
          fi

  swift:
    name: codeql (swift)
    needs: changes
    # Building under CodeQL's tracer takes 30-50 minutes on a macOS runner, so the Swift analysis runs
    # nightly on integration, on demand, and on every release push to main that changes Swift, not on
    # each pull request (ADR-0013 addendum). It is not a required check.
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
      || (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.swift == 'true')
    runs-on: macos-26
    timeout-minutes: 90
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select the pinned Xcode major version (interim 26 until Xcode 27, PAP-029)
        env:
          XCODE_MAJOR: "26"
        run: |
          xcode="$(find /Applications -maxdepth 1 -name "Xcode_${XCODE_MAJOR}*.app" 2>/dev/null | sort -V | tail -1)"
          [ -n "$xcode" ] || { echo "::error::Xcode ${XCODE_MAJOR} is not installed on this runner image"; exit 1; }
          sudo xcode-select -s "$xcode/Contents/Developer"
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: swift
          queries: security-extended
          build-mode: manual
      - name: Install pinned XcodeGen (checksum verified)
        env:
          XCODEGEN_VERSION: "2.46.0"
          XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
        run: |
          curl -sSL -o xcodegen.zip "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          echo "${XCODEGEN_SHA256}  xcodegen.zip" | shasum -a 256 -c -
          unzip -q xcodegen.zip -d "$RUNNER_TEMP/xcodegen"
          echo "$RUNNER_TEMP/xcodegen/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Build (unsigned, one architecture)
        # CodeQL traces every compiler call, so this build is most of the job's time. It needs each
        # source compiled once: one simulator architecture (the generic destination otherwise builds
        # arm64 and x86_64) and no index store (docs.github.com, CodeQL build options for Swift).
        run: |
          xcodegen generate
          xcodebuild build -scheme PDFAlgoPro -destination 'generic/platform=iOS Simulator' \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES COMPILER_INDEX_STORE_ENABLE=NO CODE_SIGNING_ALLOWED=NO
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
