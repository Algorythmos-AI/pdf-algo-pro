# Milestones map to roadmap phases (docs/product/roadmap.md). Apply with `uv run --with pyyaml==6.0.2 python scripts/gh/sync_github.py milestones` (dry run; add --apply).
milestones:
  - title: Foundation
    description: "Planning package, readiness gate, repository and toolchain foundations. No app features."
  - title: MVP
    description: "First TestFlight build: read, annotate, fill forms and sign, scan and OCR, and on-device document intelligence on iPhone."
  - title: V1
    description: "First App Store release: editing, organising, subscriptions, EN + FR."
  - title: V1.1
    description: "Refinement after launch: quality, performance, accessibility, on-device translation, document compare and the most requested gaps."
  - title: V2
    description: "iPad-first experience and Mac; the opt-in Claude tier at general availability."
